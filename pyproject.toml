[project]
name = "kerykeion-mcp"
version = "0.3.2"
description = "MCP server for astrological chart generation using Kerykeion"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Ben Jasper" }]
keywords = ["mcp", "astrology", "kerykeion", "charts"]

dependencies = [
    "mcp[cli]>=1.0.0",
    # engine.check() requires the Swiss Ephemeris backend (the [swiss] extra).
    # Widen the pin only after re-running the polar and engine tests.
    "kerykeion[swiss]>=6.0.5,<6.1",
    "pytz>=2024.1",
    "cairosvg>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
kerykeion-mcp = "kerykeion_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kerykeion_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
